<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wax Santé — Mode Hors Ligne</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 440px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: #0f3735;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
        color: #2dd4bf;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background-color: #0d9488;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        border: none;
      }
      .btn:hover {
        background-color: #14b8a6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Wax Santé — Hors Connexion</h1>
      <p>
        Votre appareil n'est actuellement pas connecté à Internet. L'application enregistrée en local reste disponible, mais la traduction vocale en direct requiert une connexion réseau active.
      </p>
      <button class="btn" onclick="window.location.reload()">Réessayer la connexion</button>
    </div>
  </body>
</html>
